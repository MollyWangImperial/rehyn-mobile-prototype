services:
  - type: web
    name: rehyn-phone-prototype
    runtime: static
    branch: codex/render-phone-prototype
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist/client
    autoDeployTrigger: off
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
